# Routine version update pull requests are switched off (a limit of 0). Known vulnerabilities are still
# caught by the weekly dependency audit in .github/workflows/audit.yml, and shown as Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
